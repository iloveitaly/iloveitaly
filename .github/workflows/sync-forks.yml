---
# This workflow synchronizes eligible public forks with their upstream repo.
# Super useful to easily kick off cloud coding agents for open source projects from
# the repo that you control.
# Personal Access Token (PAT). It is triggered manually or runs daily.
# Note: The PAT requires the 'repo' scope (classic PAT) to function correctly.
#
# Eligibility rules:
# - Fork is new (< 2 months old): synced automatically.
# - Fork is older (>= 2 months): only synced if a new branch has been added by the user in the last 2 months.
name: Sync Forks

"on":
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync eligible public forks
        env:
          # A classic Personal Access Token with the 'repo' scope is required
          GH_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
        run: |
          python3 .github/scripts/sync-forks.py | \
          while read -r repo; do
            if [ -n "$repo" ]; then
              echo "Syncing $repo..."
              gh repo sync "$repo" || echo "::warning::Failed to sync $repo"
            fi
          done

